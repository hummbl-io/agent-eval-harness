[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Deterministic Rule-Adherence & Constraint Satisfaction Benchmark for LLM Agents"
readme = "README.md"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "Reuben Bowlby", email = "reuben@hummbl.io" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
agent-eval = "agent_eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_eval_harness*"]
exclude = ["assets*", "tests*", "examples*"]

[project.urls]
Homepage = "https://github.com/hummbl-dev/agent-eval-harness"
Repository = "https://github.com/hummbl-dev/agent-eval-harness"
Issues = "https://github.com/hummbl-dev/agent-eval-harness/issues"
[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
