<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="360" rx="16" fill="url(#bg3)" stroke="#1e293b" stroke-width="2" />

  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">AGENT EVAL HARNESS: DETERMINISTIC RULE BENCHMARK</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Constraint Satisfaction &amp; Behavioral Invariant Evaluation for Frontier LLMs</text>

  <!-- Input -->
  <g transform="translate(40, 110)" filter="url(#shadow3)">
    <rect width="260" height="200" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#0284c7" fill-opacity="0.3" />
    <text x="20" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">1. Agent Response</text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Text Generation</text>
    <text x="20" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Tool Invocation Traces</text>
    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#cbd5e1">• State Mutations</text>
    <text x="20" y="160" font-family="sans-serif" font-size="12" fill="#94a3b8">Raw LLM Trajectory</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 320 210 L 350 210" stroke="#64748b" stroke-width="3" stroke-dasharray="4" />

  <!-- Engine -->
  <g transform="translate(370, 110)" filter="url(#shadow3)">
    <rect width="260" height="200" rx="12" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#be185d" fill-opacity="0.3" />
    <text x="20" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#f472b6">2. Constraint Rules</text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Negative Constraints (No PII)</text>
    <text x="20" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Positive Invariants (Format)</text>
    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Boundary Limits (Scope)</text>
    <text x="20" y="160" font-family="sans-serif" font-size="12" fill="#f472b6">Deterministic Matcher</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 650 210 L 680 210" stroke="#64748b" stroke-width="3" stroke-dasharray="4" />

  <!-- Scorecard -->
  <g transform="translate(700, 110)" filter="url(#shadow3)">
    <rect width="260" height="200" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#047857" fill-opacity="0.3" />
    <text x="20" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399">3. Scorecard &amp; Diff</text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Compliance Score (0-100%)</text>
    <text x="20" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Violation Line Items</text>
    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Model Drift Regression Log</text>
    <text x="20" y="160" font-family="sans-serif" font-size="12" fill="#10b981">CI Gate Validation</text>
  </g>
</svg>
