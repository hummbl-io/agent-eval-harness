<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="eval-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f472b6" />
    </marker>
    <marker id="arr-green2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <filter id="eval-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="320" rx="14" fill="url(#eval-bg)" stroke="#1e293b" stroke-width="1.5" />

  <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
    AGENT EVAL HARNESS: DETERMINISTIC RULE &amp; CONSTRAINT BENCHMARK
  </text>

  <!-- Step 1 -->
  <g transform="translate(35, 75)" filter="url(#eval-shadow)">
    <rect width="265" height="210" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <rect x="0" y="0" width="265" height="38" rx="10" fill="#0369a1" fill-opacity="0.25" />
    <text x="18" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">1. Agent Response Trajectory</text>
    <text x="18" y="68" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Text Generation Output</text>
    <text x="18" y="98" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Tool Invocation Traces</text>
    <text x="18" y="128" font-family="sans-serif" font-size="12" fill="#cbd5e1">• State Mutation Payloads</text>
    <text x="18" y="158" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Multi-Turn Dialog Context</text>
    <text x="18" y="190" font-family="sans-serif" font-size="11" fill="#38bdf8">Raw LLM Trajectory</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(305, 160)">
    <path d="M 5 0 L 55 0" stroke="#f472b6" stroke-width="2" marker-end="url(#arr-pink)" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(370, 75)" filter="url(#eval-shadow)">
    <rect width="265" height="210" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <rect x="0" y="0" width="265" height="38" rx="10" fill="#9d174d" fill-opacity="0.3" />
    <text x="18" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#f472b6">2. Constraint Engine</text>
    <text x="18" y="68" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Negative Constraints (No PII)</text>
    <text x="18" y="98" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Positive Invariants (Format)</text>
    <text x="18" y="128" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Scope &amp; Safety Boundaries</text>
    <text x="18" y="158" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Exact Regex &amp; AST Matching</text>
    <text x="18" y="190" font-family="sans-serif" font-size="11" fill="#f472b6">Deterministic Matcher</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(640, 160)">
    <path d="M 5 0 L 55 0" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green2)" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(705, 75)" filter="url(#eval-shadow)">
    <rect width="260" height="210" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="38" rx="10" fill="#065f46" fill-opacity="0.3" />
    <text x="18" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399">3. Scorecard &amp; Gating</text>
    <text x="18" y="68" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Compliance Score (0-100%)</text>
    <text x="18" y="98" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Violation Line Items</text>
    <text x="18" y="128" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Model Drift Regression Log</text>
    <text x="18" y="158" font-family="sans-serif" font-size="12" fill="#cbd5e1">• CI Gating Pass/Fail</text>
    <text x="18" y="190" font-family="sans-serif" font-size="11" fill="#34d399">Regression Immunity</text>
  </g>
</svg>
